<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>正在启动码道 Switch…</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }
      .card {
        width: min(440px, calc(100vw - 32px));
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 32px 28px;
        text-align: center;
        box-shadow: 0 12px 32px -12px rgba(15, 23, 42, 0.08);
      }
      .mark {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        background: #0f172a;
        color: #34d399;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 20px;
        margin-bottom: 16px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 18px;
        font-weight: 600;
      }
      p {
        margin: 0;
        font-size: 13px;
        line-height: 1.6;
        color: #475569;
      }
      .spinner {
        width: 24px;
        height: 24px;
        margin: 20px auto 12px;
        border: 2.5px solid #e2e8f0;
        border-top-color: #059669;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      .meta {
        font-size: 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color: #64748b;
      }
      .error {
        display: none;
        margin-top: 16px;
        padding: 12px 14px;
        border-radius: 10px;
        background: #fef2f2;
        border: 1px solid #fecaca;
        color: #991b1b;
        font-size: 12px;
        text-align: left;
        white-space: pre-wrap;
        word-break: break-word;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">码</div>
      <h1>码道 Switch 正在启动</h1>
      <p id="status">正在拉起内置 CodeArts2API 网关核心并加载控制台…</p>
      <div id="spinner" class="spinner"></div>
      <div class="meta">127.0.0.1:10087</div>
      <div id="error" class="error"></div>
    </div>
    <script>
      window.__setBootStatus = function (msg) {
        var el = document.getElementById('status');
        if (el) el.textContent = msg;
      };
      window.__setBootError = function (msg) {
        var sp = document.getElementById('spinner');
        var err = document.getElementById('error');
        var status = document.getElementById('status');
        if (sp) sp.style.display = 'none';
        if (status) status.textContent = '网关核心启动失败，请检查下方诊断信息：';
        if (err) {
          err.style.display = 'block';
          err.textContent = msg;
        }
      };
    </script>
  </body>
</html>
