name: Build & Release Windows Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: '可选：填写版本号（如 v1.0.0）自动发布到 GitHub Releases；留空则仅在 Actions 产物中提供下载'
        required: false
        default: 'v1.0.2'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (Tauri v2 + Go Sidecar)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.4'
          cache-dependency-path: gateway/go.mod

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies & build UI
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) {
            npm ci
          } else {
            npm install
          }
          npm run build

      - name: Embed built UI into gateway/internal/server/switch_dist
        shell: pwsh
        run: |
          $dst = "gateway/internal/server/switch_dist"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Get-ChildItem -Path $dst -Force | Where-Object { $_.Name -ne ".gitkeep" } | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item -Recurse -Force "dist/*" $dst
          Remove-Item -Recurse -Force "$dst/assets/aistudio" -ErrorAction SilentlyContinue

      - name: Build Go standalone binary & windowless Tauri sidecar
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } elseif ("${{ inputs.release_tag }}" -ne "") { "${{ inputs.release_tag }}" } else { "1.0.0" }
          New-Item -ItemType Directory -Force -Path "dist-bin" | Out-Null
          New-Item -ItemType Directory -Force -Path "src-tauri/binaries" | Out-Null
          Push-Location gateway
          try {
            go test -v ./internal/protocol/...
            $env:CGO_ENABLED = "0"
            $env:GOOS = "windows"
            $env:GOARCH = "amd64"
            go build -trimpath -ldflags="-s -w -X main.version=$ver" -o "../dist-bin/codearts-switch-gateway-windows-amd64.exe" .
            go build -trimpath -ldflags="-s -w -H=windowsgui -X main.version=$ver" -o "../src-tauri/binaries/codearts-gateway-x86_64-pc-windows-msvc.exe" .
          } finally {
            Pop-Location
          }

      - name: Build Tauri v2 Windows installers (NSIS & MSI)
        shell: pwsh
        run: npx --yes @tauri-apps/cli@2 build

      - name: Collect release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release-assets" | Out-Null
          Copy-Item -Force "src-tauri/target/release/bundle/nsis/*.exe" "release-assets/" -ErrorAction SilentlyContinue
          Copy-Item -Force "src-tauri/target/release/bundle/msi/*.msi" "release-assets/" -ErrorAction SilentlyContinue
          Copy-Item -Force "dist-bin/codearts-switch-gateway-windows-amd64.exe" "release-assets/" -ErrorAction SilentlyContinue
          Get-ChildItem "release-assets"

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: codearts-switch-windows-x64
          path: release-assets/*
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
          name: 码道 Switch ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
          generate_release_notes: true
          files: release-assets/*
